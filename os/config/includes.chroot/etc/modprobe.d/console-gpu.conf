# Os drivers NVIDIA ficam fora do carregamento automático.
# O serviço console-gpu escolhe e carrega o driver certo no boot
# (/opt/console/bin/console-gpu-setup).
blacklist nouveau
blacklist nvidia
blacklist nvidia-drm
blacklist nvidia-modeset
blacklist nvidia-current
blacklist nvidia-tesla-470
blacklist nvidia-tesla-470-drm
blacklist nvidia-tesla-470-modeset
